<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Momentify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- <h1>Hello Extensions</h1> -->
    <div id="home">
      <div class="page__header">
        <form action="" id="search" class="search">
          <input type="search" aria-label="Search by video title" />
        </form>
      </div>
      <div id="videos-list">
        <p>Total saved videos: <span id="videos-count">0</span></p>
      </div>
    </div>

    <div id="bookmark-color-picker" popover="auto" class="bm-color-picker">
      <form class="bm-color-picker__form">
        <label
          class="bm-color-picker__color-option"
          style="background-color: #008b8b"
        >
          <span class="scr-only">DarkCyan</span>
          <input type="radio" name="color" value="#008B8B" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #00bfff"
        >
          <span class="scr-only">DeepSkyBlue</span>
          <input type="radio" name="color" value="#00BFFF" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #7b68ee"
        >
          <span class="scr-only">MediumSlateBlue</span>
          <input type="radio" name="color" value="#7B68EE" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #90ee90"
        >
          <span class="scr-only">LightGreen</span>
          <input type="radio" name="color" value="#90EE90" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #ff7f50"
        >
          <span class="scr-only">Coral</span>
          <input type="radio" name="color" value="#FF7F50" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #ffdead"
        >
          <span class="scr-only">NavajoWhite</span>
          <input type="radio" name="color" value="#FFDEAD" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #ee82ee"
        >
          <span class="scr-only">Violet</span>
          <input type="radio" name="color" value="#EE82EE" class="scr-only" />
        </label>
        <label
          class="bm-color-picker__color-option"
          style="background-color: #ffff00"
        >
          <span class="scr-only">Yellow</span>
          <input type="radio" name="color" value="#FFFF00" class="scr-only" />
        </label>
      </form>
    </div>

    <template id="video-template">
      <div data-component="video-container" class="video-container">
        <details data-component="video" class="video">
          <summary data-component="video-header" class="video__header">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="video-header__marker"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
            <img
              data-component="thumbnail"
              class="video__thumbnail"
              src=""
              alt=""
            />
            <h2 data-component="video-title" class="video__title"></h2>
          </summary>
          <p>Count: <span data-component="bookmarks-count">0</span></p>
          <ul
            data-component="bookmarks-list"
            class="video__list"
            style="display: none"
          ></ul>
          <p
            data-component="empty-video-msg"
            class="video__empty-msg"
            style="display: none"
          >
            There are no bookmarks yet
          </p>
        </details>
        <button
          aria-label="Delete video"
          data-component="delete-video-btn"
          class="video-container__action"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-trash-icon lucide-trash"
          >
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>
    </template>

    <template id="bookmark-template">
      <div data-component="bookmark" class="bm">
        <div data-component="bookmark-col-1">
          <button
            data-component="bookmark-color"
            class="bm__color"
            aria-label="Select color"
          ></button>
        </div>
        <div data-component="bookmark-col-2">
          <label data-component="bookmark-title" class="bm__title">
            <span class="scr-only">Bookmark title</span>
            <textarea
              data-component="bookmark-title-input"
              name="title"
              minlength="1"
              maxlength="80"
              required
            ></textarea>
            <span aria-live="polite" aria-atomic="false">
              <span class="scr-only">Characters remaining</span>
              <span data-component="bookmark-title-chars-count">0</span>/<span
                >80</span
              >
            </span>
          </label>
          <p data-component="bookmark-timestamp" class="bm__time"></p>
          <div>
            <button
              aria-label="Play video"
              data-component="play-btn"
              class="bm__action"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-play-icon lucide-play"
              >
                <path
                  d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                />
              </svg>
            </button>
            <button
              aria-label="Delete bookmark"
              data-component="delete-bm-btn"
              class="bm__action"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-trash-icon lucide-trash"
              >
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </button>
            <button
              aria-label="Copy bookmark link"
              data-component="copy-bm-btn"
              class="bm__action"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-link-icon lucide-link"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                />
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                />
              </svg>
            </button>
          </div>
          <details>
            <summary>Toggle Note</summary>
            <textarea
              data-component="bookmark-note-input"
              name="note"
              minlength="0"
              maxlength="200"
              placeholder="Add a note (optional)"
            ></textarea>
            <span aria-live="polite" aria-atomic="false">
              <span class="scr-only">Characters remaining</span>
              <span data-component="bookmark-note-chars-count">0</span>/<span
                >200</span
              >
            </span>
          </details>
        </div>
      </div>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
