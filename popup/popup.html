<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Momentify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="root"></div>

    <dialog
      id="bookmark-color-picker"
      popover="auto"
      class="popup-base bm-color-picker"
      aria-label="Color palette"
    >
      <button
        popovertarget="bookmark-color-picker"
        popovertargetaction="close"
        aria-label="Close menu"
        class="btn-base btn-icon popup-floating-close"
      >
        <svg
          aria-hidden
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
      <form
        id="color-picker-form"
        data-component="color-picker-form"
        class="bm-color-picker__form"
      ></form>
      <template id="color-picker-template">
        <label
          data-component="color-picker-item-label"
          class="bm-color-picker__color-option"
        >
          <span data-component="color-picker-item-name" class="scr-only"></span>
          <input
            role="menuitemradio"
            type="radio"
            name="color"
            value=""
            class="scr-only"
            data-component="color-picker-item-input"
          />
        </label>
      </template>
    </dialog>

    <dialog
      id="tag-picker"
      popover="auto"
      aria-label="Select or create tag"
      class="popup-base tag-picker"
    >
      <div class="tag-picker__content">
        <button
          popovertarget="tag-picker"
          popovertargetaction="close"
          aria-label="Close dialog"
          class="btn-base btn-icon btn popup-floating-close tag-picker__close"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <form id="tag-picker-form" class="tag-picker__header">
          <input
            id="tag-picker-input"
            aria-label="New tag name"
            type="text"
            name="tag"
            required
            minlength=""
            maxlength=""
            placeholder="New tag name"
            class="input-base input tag-picker__input"
          />
        </form>
        <div id="tag-picker-list" class="tag-picker__list"></div>
      </div>
      <template id="tag-item-template">
        <div
          data-component="tag-picker-item"
          data-tag-root=""
          class="tag-picker__list-item"
        >
          <button
            data-component="tag-picker-item-select"
            data-tag-id=""
            data-tag-picker-action
            data-tag-color
            class="btn-base btn tag-picker__tag"
          >
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
              />
              <path d="M2 10h20" />
            </svg>
            <span data-component="tag-picker-item-title" data-tag-title></span>
          </button>
          <button
            data-component="tag-picker-item-edit"
            popovertarget="tag-picker-edit"
            popovertargetaction="toggle"
            data-tag-id=""
            aria-label="Edit tag"
            aria-haspopup="dialog"
            class="btn-base btn-icon btn tag-picker__edit"
          >
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              />
              <path
                d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"
              />
            </svg>
          </button>
        </div>
      </template>
    </dialog>

    <dialog
      id="tag-picker-edit"
      popover="auto"
      aria-label="Edit or delete tag"
      class="popup-base tag-picker-edit"
    >
      <div class="tag-picker-edit__content">
        <button
          popovertarget="tag-picker-edit"
          popovertargetaction="close"
          aria-label="Close dialog"
          class="btn-base btn-icon btn popup-floating-close tag-picker__close"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <form id="tag-picker-edit-form">
          <input
            id="tag-picker-edit-input"
            aria-label="Change tag name"
            type="text"
            name="tag"
            required
            minlength=""
            maxlength=""
            placeholder="Change tag name"
            class="input-base input tag-picker__input"
          />
        </form>
        <button
          id="tag-picker-edit-delete"
          class="btn-base btn btn-outlined--danger"
        >
          Delete
        </button>
      </div>
      <form id="tag-picker-edit-colors" class="tag-picker-edit__colors"></form>
      <template id="tag-picker-color-item-template">
        <label
          data-component="tag-color-picker-item-label"
          class="btn-base btn tag-color-picker__color-option"
        >
          <span
            data-component="tag-picker-color"
            class="tag-color-picker__color-box"
          ></span>
          <span
            data-component="tag-picker-color-name"
            class="tag-color-picker__color-name"
          ></span>
          <input
            type="radio"
            name="color"
            value=""
            data-component="tag-picker-color-item-input"
            class="scr-only"
          />
        </label>
      </template>
    </dialog>

    <template id="home-template">
      <div id="page-header" class="page__header">
        <div class="searchbar-container">
          <div class="searchbar">
            <form id="search" class="search">
              <input
                type="search"
                name="search"
                aria-label="Search by video title"
                placeholder="Search by video title"
                class="input-base search__input"
              />
            </form>
            <button
              id="tag-filter-trigger"
              popovertarget="tag-picker"
              popovertargetaction="toggle"
              data-action="select-filter-tag"
              aria-label="Filter videos by tag"
              aria-haspopup="dialog"
              class="btn-base btn-icon btn"
            >
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                />
                <path d="M2 10h20" />
              </svg>
            </button>
          </div>
          <div id="selected-filter-tag"></div>
          <p id="filters-result-status" class="scr-only" aria-live="polite"></p>
          <template id="selected-filter-tag-template">
            <div
              data-component="selected-filter-tag"
              data-tag-root=""
              data-tag-color
              class="tag selected-filter-tag"
            >
              <span class="scr-only">Videos are filtered by:</span>
              <span
                data-component="selected-filter-tag-title"
                data-tag-title
                class="tag__title"
              ></span>
              <button
                data-component="selected-filter-tag-del-button"
                class="btn-base btn-icon btn tag__del-btn"
                aria-label="Remove tag filter"
              >
                <svg
                  aria-hidden
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="m15 9-6 6" />
                  <path d="m9 9 6 6" />
                </svg>
              </button>
            </div>
          </template>
        </div>
        <button
          id="settings-link"
          aria-label="Navigate to settings"
          class="btn-base btn-icon btn page__header-action"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14 17H5" />
            <path d="M19 7h-9" />
            <circle cx="17" cy="17" r="3" />
            <circle cx="7" cy="7" r="3" />
          </svg>
        </button>
      </div>
      <div id="videos-container" class="videos">
        <div class="videos__details">
          <p>
            Total saved videos:
            <span id="videos-count" class="videos__count">0</span>
          </p>
        </div>
        <div id="videos-list" class="videos__list"></div>
      </div>
    </template>

    <template id="settings-template">
      <div class="page__header">
        <button
          id="home-link"
          aria-label="Navigate to home"
          class="btn-base btn-icon btn page__header-action"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </button>
      </div>
      <div class="page__content settings__content">
        <section class="settings__section">
          <form id="theme-switcher" class="theme-switcher">
            <label class="btn-base btn theme-switcher__button">
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
              Light
              <input
                type="radio"
                name="theme"
                value="light"
                data-component="theme-input"
                class="scr-only"
              />
            </label>
            <label class="btn-base btn theme-switcher__button">
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>
              Dark
              <input
                type="radio"
                name="theme"
                value="dark"
                data-component="theme-input"
                class="scr-only"
              />
            </label>
            <label class="btn-base btn theme-switcher__button">
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 17v4" />
                <path d="m14.305 7.53.923-.382" />
                <path d="m15.228 4.852-.923-.383" />
                <path d="m16.852 3.228-.383-.924" />
                <path d="m16.852 8.772-.383.923" />
                <path d="m19.148 3.228.383-.924" />
                <path d="m19.53 9.696-.382-.924" />
                <path d="m20.772 4.852.924-.383" />
                <path d="m20.772 7.148.924.383" />
                <path
                  d="M22 13v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"
                />
                <path d="M8 21h8" />
                <circle cx="18" cy="6" r="3" />
              </svg>
              System
              <input
                type="radio"
                name="theme"
                value="system"
                data-component="theme-input"
                class="scr-only"
                checked
              />
            </label>
          </form>
        </section>
        <section class="settings__section">
          <h2 class="settings__section-title">UI settings</h2>
          <form id="content-settings-form">
            <div class="ui-settings__controller">
              <label for="quick-save-switch">Show "Quick save" button</label>
              <button
                id="quick-save-switch"
                type="button"
                role="switch"
                aria-checked="false"
                class="switch"
              ></button>
              <input
                id="quick-save-input"
                type="checkbox"
                name="quick-save"
                hidden
                tabindex="-1"
              />
            </div>
            <div class="ui-settings__controller">
              <label for="edited-save-switch">Show "Edit & save" button</label>
              <button
                id="edited-save-switch"
                type="button"
                role="switch"
                aria-checked="false"
                class="switch"
              ></button>
              <input
                id="edited-save-input"
                type="checkbox"
                name="edited-save"
                hidden
                tabindex="-1"
              />
            </div>
          </form>
        </section>
        <section class="settings__section">
          <h2 class="settings__section-title">Import/Export</h2>
          <div>
            <label
              for="import-action"
              class="btn-base btn-outlined--primary settings__imp-exp-btn"
            >
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1"
                />
                <path d="M2 13h10" />
                <path d="m9 16 3-3-3-3" />
              </svg>
              Import
              <input
                type="file"
                accept="application/json"
                name="import"
                id="import-action"
                hidden
              />
            </label>
            <button
              id="export-action"
              class="btn-base btn-outlined--primary settings__imp-exp-btn"
            >
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M2 7.5V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-1.5"
                />
                <path d="M2 13h10" />
                <path d="m5 10-3 3 3 3" />
              </svg>
              Export
            </button>
          </div>
          <p
            id="import-alert"
            aria-live="assertive"
            class="settings__imp-exp-alert"
          ></p>
        </section>
        <section class="settings__section">
          <div class="settings__section-header">
            <h2 class="settings__section-title">Shortcuts</h2>
            <a id="shortcuts-link" href="#" class="link">Edit</a>
          </div>
          <ul id="shortcuts" class="settings__shortcuts-list"></ul>
          <template id="shortcut-template">
            <li>
              <span
                data-component="shortcut"
                class="settings__shortcuts"
              ></span>
              –
              <span data-component="shortcut-desc"></span>
            </li>
          </template>
        </section>
        <section class="settings__section">
          <h2 class="settings__section-title">Clear all data</h2>
          <p class="settings__settings-clear-desc">
            This will delete all saved bookmarks
          </p>
          <button
            id="data-reset-button"
            command="show-modal"
            commandfor="reset-alert"
            aria-haspopup="dialog"
            class="btn-base btn btn-filled--danger settings__settings-clear-btn"
          >
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m16 22-1-4" />
              <path
                d="M19 14a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2h-3a1 1 0 0 1-1-1V4a2 2 0 0 0-4 0v5a1 1 0 0 1-1 1H6a2 2 0 0 0-2 2v1a1 1 0 0 0 1 1"
              />
              <path
                d="M19 14H5l-1.973 6.767A1 1 0 0 0 4 22h16a1 1 0 0 0 .973-1.233z"
              />
              <path d="m8 22 1-4" />
            </svg>
            Clear
          </button>
          <p
            id="reset-alert-message"
            aria-live="assertive"
            class="settings__reset-alert-message"
          ></p>
          <dialog
            id="reset-alert"
            role="alertdialog"
            aria-describedby="reset-alert-title"
            class="popup-base settings__reset-alert"
          >
            <h2 id="reset-alert-title" class="settings__reset-alert-title">
              This action is irreversible. Are you sure?
            </h2>
            <button
              id="reset-alert-confirm-button"
              command="close"
              commandfor="reset-alert"
              class="btn-base btn btn-outlined--danger settings__reset-alert-action"
            >
              Confirm
            </button>
            <button
              command="close"
              commandfor="reset-alert"
              class="btn-base btn btn-outlined--primary settings__reset-alert-action"
            >
              Cancel
            </button>
          </dialog>
        </section>
      </div>
    </template>

    <template id="video-template">
      <div data-component="video-container" class="card video-container">
        <div
          data-component="tag"
          data-tag-root=""
          data-tag-color
          class="tag video-tag"
        >
          <button
            data-component="video-tag-select"
            popovertarget="tag-picker"
            popovertargetaction="toggle"
            data-action="select-video-tag"
            data-video-id=""
            class="btn-base btn tag__trigger"
          >
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
              />
              <path d="M2 10h20" />
            </svg>
            <span>
              <span class="scr-only" data-tag-empty-title
                >Set new tag for the current video</span
              >
              <span class="scr-only" data-tag-selected-title-hint hidden
                >Tag:
              </span>
              <span
                data-component="video-tag-title"
                data-tag-title
                class="tag__title"
              ></span>
            </span>
          </button>
          <button
            hidden
            data-component="video-tag-del-button"
            aria-label="Remove tag from video"
            class="btn-base btn-icon btn tag__del-btn"
          >
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="m15 9-6 6" />
              <path d="m9 9 6 6" />
            </svg>
          </button>
        </div>
        <details data-component="video" class="video">
          <summary data-component="video-header" class="video__header">
            <svg
              class="video-header__marker"
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
            <div class="video__header-content">
              <img
                data-component="thumbnail"
                class="video__thumbnail"
                src=""
                alt=""
              />
              <h2 data-component="video-title" class="video__title"></h2>
            </div>
          </summary>
          <div class="video__content">
            <div class="video__bookmarks-count-details">
              <p aria-live="polite">
                Number of bookmarks:
                <span data-component="bookmarks-count">0</span>
              </p>
              <button
                data-component="clear-bookmarks-btn"
                class="btn-base btn btn-outlined--danger video__bookmarks-clear"
              >
                Clear all
              </button>
            </div>
            <form
              data-component="bookmarks-sorter"
              class="video__bookmarks-sorter"
            >
              <fieldset>
                <legend>Sort by:</legend>
                <label class="btn-base btn video__bookmarks-sort-btn">
                  <svg
                    aria-hidden
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m14 18 4 4 4-4" />
                    <path d="M16 2v4" />
                    <path d="M18 14v8" />
                    <path
                      d="M21 11.354V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7.343"
                    />
                    <path d="M3 10h18" />
                    <path d="M8 2v4" />
                  </svg>
                  Oldest
                  <input
                    type="radio"
                    name="sortBy"
                    value="old"
                    class="scr-only"
                  />
                </label>
                <label class="btn-base btn video__bookmarks-sort-btn">
                  <svg
                    aria-hidden
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m14 18 4-4 4 4" />
                    <path d="M16 2v4" />
                    <path d="M18 22v-8" />
                    <path
                      d="M21 11.343V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9"
                    />
                    <path d="M3 10h18" />
                    <path d="M8 2v4" />
                  </svg>
                  Newest
                  <input
                    type="radio"
                    name="sortBy"
                    value="new"
                    class="scr-only"
                    checked
                  />
                </label>
                <label class="btn-base btn video__bookmarks-sort-btn">
                  <svg
                    aria-hidden
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M12 6v6l1.56.78" />
                    <path d="M13.227 21.925a10 10 0 1 1 8.767-9.588" />
                    <path d="m14 18 4-4 4 4" />
                    <path d="M18 22v-8" />
                  </svg>
                  Timestamp (asc)
                  <input
                    type="radio"
                    name="sortBy"
                    value="time_asc"
                    class="scr-only"
                  />
                </label>
                <label class="btn-base btn video__bookmarks-sort-btn">
                  <svg
                    aria-hidden
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M12 6v6l2 1" />
                    <path d="M12.337 21.994a10 10 0 1 1 9.588-8.767" />
                    <path d="m14 18 4 4 4-4" />
                    <path d="M18 14v8" />
                  </svg>
                  Timestamp (desc)
                  <input
                    type="radio"
                    name="sortBy"
                    value="time_desc"
                    class="scr-only"
                  />
                </label>
              </fieldset>
            </form>
            <ul data-component="bookmarks-list" class="video__list"></ul>
            <p data-component="empty-video-msg" class="video__empty-msg">
              There are no bookmarks yet
            </p>
          </div>
        </details>
        <button
          aria-label="Delete video"
          data-component="delete-video-btn"
          class="btn-base btn-icon btn video-container__action"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>
    </template>

    <template id="bookmark-template">
      <article data-component="bookmark" class="bm">
        <div data-component="bookmark-col-1">
          <button
            data-component="bookmark-color"
            aria-label="Select color"
            aria-haspopup="dialog"
            aria-details="bookmark-color-picker"
            class="bm__color"
          >
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
              />
              <path d="m15 5 4 4" />
            </svg>
          </button>
        </div>
        <div data-component="bookmark-col-2" class="bm__content">
          <div class="bm__details-container">
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="bm__details-icon"
            >
              <path
                d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
              />
              <path d="m15 5 4 4" />
            </svg>
            <h3 data-component="bookmark-title" class="bm__title">
              <label>
                <span class="scr-only">Bookmark title</span>
                <input
                  data-component="bookmark-title-input"
                  name="title"
                  required
                  class="input-base bm__title-input"
                  aria-describedby=""
                />
              </label>
            </h3>
            <span
              id=""
              data-component="bookmark-title-chars-hint"
              aria-live="polite"
              aria-atomic="false"
              class="bm__title-chars-hint"
            >
              <span class="scr-only">Characters remaining</span>
              <span data-component="bookmark-title-chars-count">0</span>/<span
                data-component="bookmark-title-chars-max-count"
              ></span>
            </span>
          </div>
          <div class="bm__details-container">
            <svg
              aria-hidden
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="bm__details-icon"
            >
              <path
                d="M6 22V2.8a.8.8 0 0 1 1.17-.71l11.38 5.69a.8.8 0 0 1 0 1.44L6 15.5"
              />
            </svg>
            <p data-component="bookmark-timestamp" class="bm__time"></p>
          </div>
          <div class="bm__actions">
            <button
              aria-label="Play video"
              data-component="play-btn"
              class="btn-base btn-icon btn btn-filled--primary bm__action"
            >
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                />
              </svg>
            </button>
            <button
              aria-label="Delete bookmark"
              data-component="delete-bm-btn"
              class="btn-base btn-icon btn btn-filled--primary bm__action"
            >
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </button>
            <button
              aria-label="Copy bookmark link"
              data-component="copy-bm-btn"
              class="btn-base btn-icon btn btn-filled--primary bm__action"
            >
              <svg
                aria-hidden
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                />
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                />
              </svg>
            </button>
          </div>
          <details>
            <summary>Show Note</summary>
            <div class="bm__note-content">
              <label>
                <span class="scr-only">Bookmark note</span>
                <textarea
                  data-component="bookmark-note-input"
                  name="note"
                  rows="5"
                  placeholder="Add a note (optional)"
                  aria-describedby=""
                  class="input-base input bm__note-input"
                ></textarea>
              </label>
              <span
                id=""
                data-component="bookmark-note-chars-hint"
                aria-live="polite"
                aria-atomic="false"
              >
                <span class="scr-only">Characters remaining</span>
                <span data-component="bookmark-note-chars-count">0</span>/<span
                  data-component="bookmark-note-chars-max-count"
                ></span>
              </span>
            </div>
          </details>
        </div>
      </article>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
