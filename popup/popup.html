<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Momentify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="root"></div>

    <div
      id="bookmark-color-picker"
      popover="auto"
      role="menu"
      class="bm-color-picker"
    >
      <form
        id="color-picker-form"
        data-component="color-picker-form"
        class="bm-color-picker__form"
      ></form>
      <template id="color-picker-template">
        <label
          data-component="color-picker-item-label"
          class="bm-color-picker__color-option"
        >
          <span data-component="color-picker-item-name" class="scr-only"></span>
          <input
            type="radio"
            name="color"
            value=""
            class="scr-only"
            data-component="color-picker-item-input"
          />
        </label>
      </template>
    </div>

    <template id="home-template">
      <div class="page__header">
        <form action="" id="search" class="search">
          <input
            type="search"
            name="search"
            aria-label="Search by video title"
          />
        </form>
        <button
          id="settings-link"
          aria-label="Navigate to settings"
          class="page__header-action"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M14 17H5" />
            <path d="M19 7h-9" />
            <circle cx="17" cy="17" r="3" />
            <circle cx="7" cy="7" r="3" />
          </svg>
        </button>
      </div>
      <div id="videos-container" class="videos">
        <p>Total saved videos: <span id="videos-count">0</span></p>
        <div id="videos-list" class="videos__list"></div>
      </div>
    </template>

    <template id="settings-template">
      <div class="page__header">
        <button
          id="home-link"
          aria-label="Navigate to home"
          class="page__header-action"
        >
          <svg
            aria-hidden
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </button>
      </div>
      <section>
        <h2>UI settings</h2>
        <form id="content-settings-form">
          <div>
            <label for="quick-save-switch">Show "Quick save" button</label>
            <button
              id="quick-save-switch"
              type="button"
              role="switch"
              aria-checked="false"
              class="switch"
            ></button>
            <input
              id="quick-save-input"
              type="checkbox"
              name="quick-save"
              hidden
              tabindex="-1"
            />
          </div>
          <div>
            <label for="edited-save-switch">Show "Edit & save" button</label>
            <button
              id="edited-save-switch"
              type="button"
              role="switch"
              aria-checked="false"
              class="switch"
            ></button>
            <input
              id="edited-save-input"
              type="checkbox"
              name="edited-save"
              hidden
              tabindex="-1"
            />
          </div>
        </form>
      </section>
      <section>
        <h2>Import/Export</h2>
        <button id="export-action">Export</button>
        <label for="import-action">
          Import
          <input
            type="file"
            accept="application/json"
            name="import"
            id="import-action"
            hidden
          />
        </label>
        <p id="import-alert"></p>
      </section>
      <section>
        <div>
          <h2>Shortcuts</h2>
          <a id="shortcuts-link" href="#">Edit</a>
        </div>
        <ul id="shortcuts"></ul>
        <template id="shortcut-template">
          <li>
            <span data-component="shortcut"></span> –
            <span data-component="shortcut-desc"></span>
          </li>
        </template>
      </section>
      <section>
        <h2>Clear all data</h2>
        <p>This will delete all saved bookmarks</p>
        <button
          id="data-reset-button"
          command="show-modal"
          commandfor="reset-alert"
          aria-haspopup="dialog"
        >
          Clear
        </button>
        <dialog id="reset-alert" aria-describedby="reset-alert-title">
          <h2 id="reset-alert-title">
            This action is irreversible. Are you sure?
          </h2>
          <button
            id="reset-alert-confirm-button"
            command="close"
            commandfor="reset-alert"
          >
            Confirm
          </button>
          <button command="close" commandfor="reset-alert">Cancel</button>
        </dialog>
      </section>
    </template>

    <template id="video-template">
      <div data-component="video-container" class="video-container">
        <details data-component="video" class="video">
          <summary data-component="video-header" class="video__header">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="video-header__marker"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
            <img
              data-component="thumbnail"
              class="video__thumbnail"
              src=""
              alt=""
            />
            <h2 data-component="video-title" class="video__title"></h2>
          </summary>
          <div>
            <p>Count: <span data-component="bookmarks-count">0</span></p>
            <button data-component="clear-bookmarks-btn">Clear all</button>
          </div>
          <form
            data-component="bookmarks-sorter"
            class="video__bookmarks-sorter"
          >
            Sort by:
            <label class="video__bookmarks-sort-btn">
              Oldest
              <input type="radio" name="sortBy" value="old" class="scr-only" />
            </label>
            <label class="video__bookmarks-sort-btn">
              Newest
              <input
                type="radio"
                name="sortBy"
                value="new"
                class="scr-only"
                checked
              />
            </label>
            <label class="video__bookmarks-sort-btn">
              Timestamp (asc)
              <input
                type="radio"
                name="sortBy"
                value="time_asc"
                class="scr-only"
              />
            </label>
            <label class="video__bookmarks-sort-btn">
              Timestamp (desc)
              <input
                type="radio"
                name="sortBy"
                value="time_desc"
                class="scr-only"
              />
            </label>
          </form>
          <ul
            data-component="bookmarks-list"
            class="video__list"
            style="display: none"
          ></ul>
          <p
            data-component="empty-video-msg"
            class="video__empty-msg"
            style="display: none"
          >
            There are no bookmarks yet
          </p>
        </details>
        <button
          aria-label="Delete video"
          data-component="delete-video-btn"
          class="video-container__action"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-trash-icon lucide-trash"
          >
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>
    </template>

    <template id="bookmark-template">
      <div data-component="bookmark" class="bm">
        <div data-component="bookmark-col-1">
          <button
            data-component="bookmark-color"
            class="bm__color"
            aria-label="Select color"
          ></button>
        </div>
        <div data-component="bookmark-col-2">
          <label data-component="bookmark-title" class="bm__title">
            <span class="scr-only">Bookmark title</span>
            <textarea
              data-component="bookmark-title-input"
              name="title"
              required
            ></textarea>
            <span aria-live="polite" aria-atomic="false">
              <span class="scr-only">Characters remaining</span>
              <span data-component="bookmark-title-chars-count">0</span>/<span
                data-component="bookmark-title-chars-max-count"
              ></span>
            </span>
          </label>
          <p data-component="bookmark-timestamp" class="bm__time"></p>
          <div>
            <button
              aria-label="Play video"
              data-component="play-btn"
              class="bm__action"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-play-icon lucide-play"
              >
                <path
                  d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                />
              </svg>
            </button>
            <button
              aria-label="Delete bookmark"
              data-component="delete-bm-btn"
              class="bm__action"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-trash-icon lucide-trash"
              >
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </button>
            <button
              aria-label="Copy bookmark link"
              data-component="copy-bm-btn"
              class="bm__action"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-link-icon lucide-link"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                />
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                />
              </svg>
            </button>
          </div>
          <details>
            <summary>Toggle Note</summary>
            <textarea
              data-component="bookmark-note-input"
              name="note"
              placeholder="Add a note (optional)"
            ></textarea>
            <span aria-live="polite" aria-atomic="false">
              <span class="scr-only">Characters remaining</span>
              <span data-component="bookmark-note-chars-count">0</span>/<span
                data-component="bookmark-note-chars-max-count"
              ></span>
            </span>
          </details>
        </div>
      </div>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
